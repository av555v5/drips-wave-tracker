name: Wave 11 Tracker (every 2 hours)

on:
  schedule:
    # Every 2 hours at minute 07 UTC (00:07, 02:07, 04:07 ...).
    # Minute 00 is when GitHub's scheduler is busiest, so runs there are often
    # delayed or silently skipped. An offset minute is much more reliable.
    - cron: '7 */2 * * *'
    # Backup fire 30 min later. If GitHub delayed or dropped the first one, this
    # catches up; if the first one ran, bot.py sees a recent run and exits in
    # seconds (no commit, no webhook).
    - cron: '37 */2 * * *'
  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write    # needed to push runs/ and state/ back to the repo

concurrency:
  group: wave-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A Personal Access Token (secret PAT_TOKEN) makes the bot's push
          # trigger a GitHub Pages rebuild reliably. Falls back to GITHUB_TOKEN.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        id: bot
        # `shell: bash` enables pipefail, so a crash in bot.py fails the job
        # instead of being hidden by `| tee` (the default shell has no pipefail).
        shell: bash
        run: |
          python bot.py | tee runs_log.txt
          if grep -q "SKIP:" runs_log.txt; then echo "skipped=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit results, state, and GitHub Pages data
        if: steps.bot.outputs.skipped != 'true'
        run: |
          git config user.name  "wave-bot[bot]"
          git config user.email "wave-bot@users.noreply.github.com"
          # Stage each path on its own. A single `git add a b c` aborts and
          # stages NOTHING if any one path is missing (e.g. no history.json yet).
          # -A also records files the bot pruned from runs/.
          for p in runs state runs_log.txt latest.json history.json; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              git add -A "$p"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bot): Wave 11 snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            # If someone pushed in the meantime, rebase on top and retry.
            git push || { git pull --rebase --autostash && git push; }
          fi

      - name: Upload full run log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-bot-log-${{ github.run_id }}
          path: |
            runs_log.txt
            runs/
            state/
            latest.json
            history.json
          retention-days: 30

      - name: Send summary to webhook (Slack/Discord/Telegram)
        if: steps.bot.outputs.skipped != 'true'
        # NOTE: GitHub Actions does not allow the `secrets` context directly
        # inside a step-level `if:` expression, so we always run this step
        # and bail out inside the script when WAVE_WEBHOOK_URL is empty.
        env:
          WAVE_WEBHOOK_URL: ${{ secrets.WAVE_WEBHOOK_URL }}
        run: |
          if [ -z "$WAVE_WEBHOOK_URL" ]; then
            echo "WAVE_WEBHOOK_URL not set; skipping webhook."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, datetime as dt, pathlib
          url = os.environ.get('WAVE_WEBHOOK_URL')
          if not url: 
              print('No WAVE_WEBHOOK_URL set; skipping webhook.'); raise SystemExit
          # find latest run dir
          runs = sorted(pathlib.Path('runs').glob('*T*Z'))
          if not runs:
              print('No run dir found.'); raise SystemExit
          latest = runs[-1] / 'summary.json'
          if not latest.exists():
              print('No summary.json found.'); raise SystemExit
          snap = json.loads(latest.read_text())
          w = snap.get('wave', {})
          oi = snap.get('openIssues', {})
          cw = snap.get('closedInWave11', {})
          tc = snap.get('topContributors', [{}])[0] if snap.get('topContributors') else {}
          text = (
              f"🌊 *Stellar Wave {snap.get('wave', {}).get('waveNumber', 11)} — snapshot*\n"
              f"Run at (UTC): `{snap.get('runAt')}`\n"
              f"Wave status: *{w.get('status')}* "
              f"({w.get('startDate','?')[:10]} → {w.get('endDate','?')[:10]})\n"
              f"In wave window now? {'✅' if w.get('inWaveWindowNow') else '❌'}\n"
              f"Open issues total: *{oi.get('total', 0):,}*\n"
              f"Open total pts: *{oi.get('totalPoints', 0):,}* (precise Σ points × mult)\n"
              f"Closed-in-wave pts: *{cw.get('closedTotalPoints', 0):,}*\n"
              f"Max total pts (open+closed, NOT ×4): *{snap.get('maxTotalPoints', 0):,}*\n"
              f"Scored so far: *{snap.get('scoredPoints', 0):,}* pts\n"
              f"Remaining: *{snap.get('remainingPoints', 0):,}* pts\n"
              f"New issues since last run: *{snap.get('newIssuesSinceLastRun', {}).get('newSinceLastRun', 0):,}*\n"
              f"Contributors paid in Wave: *{snap.get('contributorsCount', 0):,}*\n"
              f"Top contributor: `{tc.get('contributor', '—')}` — {tc.get('pointsEarned', 0):,} pts "
              f"({tc.get('issuesClosed', 0)} issues)\n"
          )
          payload = {'text': text}
          # Discord wants {content: ...}; Slack/Telegram-style want {text: ...}.
          # We send {text: ...} which Slack and Telegram-bridges accept; for
          # Discord set the webhook URL to a Slack-compatible bridge.
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print('Webhook response:', resp.status, resp.read().decode()[:200])
          except Exception as e:
              print('Webhook send failed:', e)
          PY
