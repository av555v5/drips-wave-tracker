name: Wave 11 Tracker (every 2 hours)

on:
  schedule:
    # GitHub's scheduler is best-effort: runs are often delayed by 1-2 h and
    # many are dropped. So instead of ONE fire every 2 h, fire every 30 minutes
    # and let the "Skip check" step below turn a fire into a ~5 s no-op unless
    # the last data run is at least SKIP_MIN minutes old. Net effect: data is
    # refreshed about every 2 h, and a delayed or dropped fire is caught up by
    # the next one within 30 minutes.
    - cron: '7,37 * * * *'
  # Optional external trigger (see README note): an outside cron service can
  # POST to the repository_dispatch API every 2 h for exact timing.
  repository_dispatch:
    types: [wave-tick]
  # Manual trigger from the Actions tab: ALWAYS runs, never skipped.
  workflow_dispatch:

permissions:
  contents: write    # needed to push runs/ and state/ back to the repo

concurrency:
  group: wave-bot
  cancel-in-progress: false

env:
  SKIP_MIN: 100      # minimum minutes between data runs for scheduled / dispatch triggers

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A Personal Access Token (secret PAT_TOKEN) is optional; falls back
          # to GITHUB_TOKEN. Pages rebuilds after the bot's push either way.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Skip check
        id: gate
        shell: bash
        run: |
          skip=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f state/last_run.json ]; then
            last=$(jq -r '.runAt // empty' state/last_run.json)
            if [ -n "$last" ]; then
              last_s=$(date -d "$last" +%s 2>/dev/null || echo 0)
              age=$(( ( $(date +%s) - last_s ) / 60 ))
              echo "Last data run was ${age} min ago (threshold ${SKIP_MIN} min)"
              if [ "$age" -lt "$SKIP_MIN" ]; then skip=true; fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then echo "Skipping: data is fresh enough."; fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        id: bot
        if: steps.gate.outputs.skip != 'true'
        # `shell: bash` enables pipefail, so a crash in bot.py fails the job
        # instead of being hidden by `| tee`.
        shell: bash
        env:
          # Read access to public PRs for the contributor review flags. The default
          # token is enough; PAT_TOKEN (if set) gets a larger API budget.
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python bot.py | tee runs_log.txt
          if grep -q "SKIP:" runs_log.txt; then echo "skipped=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit results, state, and GitHub Pages data
        if: steps.gate.outputs.skip != 'true' && steps.bot.outputs.skipped != 'true'
        run: |
          git config user.name  "wave-bot[bot]"
          git config user.email "wave-bot@users.noreply.github.com"
          # Stage each path on its own: one `git add a b c` stages NOTHING if
          # any single path is missing. -A also records pruned run dirs.
          for p in runs state runs_log.txt latest.json history.json runs.json contributions.json; do
            if [ -e "$p" ] || git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              git add -A "$p"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bot): Wave 11 snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            # If something else pushed in the meantime, rebase and retry.
            git push || { git pull --rebase --autostash && git push; }
          fi

      - name: Upload full run log as artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wave-bot-log-${{ github.run_id }}
          path: |
            runs_log.txt
            runs/
            state/
            latest.json
            history.json
            runs.json
            contributions.json
          retention-days: 30

      - name: Send summary to webhook (Slack/Discord/Telegram)
        if: steps.gate.outputs.skip != 'true' && steps.bot.outputs.skipped != 'true'
        # `secrets` is not allowed in a step-level `if:`, so the script itself
        # bails out when WAVE_WEBHOOK_URL is empty.
        env:
          WAVE_WEBHOOK_URL: ${{ secrets.WAVE_WEBHOOK_URL }}
        run: |
          if [ -z "$WAVE_WEBHOOK_URL" ]; then
            echo "WAVE_WEBHOOK_URL not set; skipping webhook."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request, pathlib
          url = os.environ.get('WAVE_WEBHOOK_URL')
          if not url:
              print('No WAVE_WEBHOOK_URL set; skipping webhook.'); raise SystemExit
          runs = sorted(pathlib.Path('runs').glob('*T*Z'))
          if not runs:
              print('No run dir found.'); raise SystemExit
          latest = runs[-1] / 'summary.json'
          if not latest.exists():
              print('No summary.json found.'); raise SystemExit
          snap = json.loads(latest.read_text())
          w = snap.get('wave', {})
          oi = snap.get('openIssues', {})
          cw = snap.get('closedInWave11', {})
          tc = snap.get('topContributors', [{}])[0] if snap.get('topContributors') else {}
          text = (
              f"🌊 *Stellar Wave {w.get('waveNumber', 11)} — snapshot*\n"
              f"Run at (UTC): `{snap.get('runAt')}`\n"
              f"Wave status: *{w.get('status')}* "
              f"({(w.get('startDate') or '?')[:10]} → {(w.get('endDate') or '?')[:10]})\n"
              f"In wave window now? {'✅' if w.get('inWaveWindowNow') else '❌'}\n"
              f"Open issues total: *{oi.get('total', 0):,}*\n"
              f"Open total pts: *{oi.get('totalPoints', 0):,}*\n"
              f"Closed-in-wave pts: *{cw.get('closedTotalPoints', 0):,}*\n"
              f"Max total pts: *{snap.get('maxTotalPoints', 0):,}*\n"
              f"Scored so far: *{snap.get('scoredPoints', 0):,}* pts\n"
              f"Remaining: *{snap.get('remainingPoints', 0):,}* pts\n"
              f"New issues since last run: *{snap.get('newIssuesSinceLastRun', {}).get('newSinceLastRun', 0):,}*\n"
              f"Contributors paid in Wave: *{snap.get('contributorsCount', 0):,}*\n"
              f"Top contributor: `{tc.get('contributor', '—')}` — {tc.get('pointsEarned', 0):,} pts "
              f"({tc.get('issuesClosed', 0)} issues)\n"
          )
          req = urllib.request.Request(
              url, data=json.dumps({'text': text}).encode('utf-8'),
              headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print('Webhook response:', resp.status, resp.read().decode()[:200])
          except Exception as e:
              print('Webhook send failed:', e)
          PY
